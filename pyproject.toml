[tool.poetry]
name = "nextitslm"
version = "0.1.0"
description = "NextITS Language Model Backend"
authors = ["ryugj <labhnextits@gmail.com>"]
readme = "README.md"
packages = [{include = "backend"}]

[[tool.poetry.source]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"

[tool.poetry.dependencies]
python = ">=3.11,<3.12"
fastapi = "^0.116.0" 
uvicorn = "^0.24.0"
pydantic = "^2.11.0"
python-dotenv = "^1.1.0"
transformers = "4.57.3"
tokenizers = "0.22.1"
faiss-cpu = "^1.7.4"
flask = "^3.1.0"
flask-cors = "^4.0.0"
pillow = "^11.3.0"
httpx = "^0.26.0"
huggingface-hub = "^0.34.0"
numpy = ">=2.2,<2.3"
numba = "0.61.0"
torch = {version = "2.8.0+cu128", source = "pytorch-cu128"}
torchvision = {version = "0.23.0+cu128", source = "pytorch-cu128"}
torchaudio = {version = "2.8.0+cu128", source = "pytorch-cu128"}
pandas = "^2.3.0"
scipy = "^1.16.0"
opencv-python-headless = "^4.11.0"
pdf2image = "^1.17.0"
pypdf = "^5.9.0"
PyMuPDF = "^1.26.0"
python-multipart = "^0.0.20"
sentence-transformers = "2.7.0"
safetensors = "^0.6.0"
tqdm = "^4.67.0"
typer = "^0.16.0"
requests = "^2.32.0"
streamlit = "^1.48.0"
passlib = "^1.7.0"
python-jose = "^3.3.0"
SQLAlchemy = "^2.0.23"
termcolor = "^3.3.0"
fuzzywuzzy = "^0.18.0"
python-decouple = "^3.8"
grpcio = "1.75.0"
weaviate-client = "^4.19.2"
nvidia-ml-py = "^13.590.44"
pynvml = "^13.0.1"
nest-asyncio = "^1.6.0"
websockets = "^15.0.1"
beautifulsoup4 = "^4.14.3"
markdown = "^3.10"
python-magic = "^0.4.27"
uvloop = "^0.22.1"
psutil = "^7.2.1"
pyzmq = "^27.1.0"
triton = "3.4.0"
tiktoken = "^0.12.0"
setuptools = "^80.9.0"
accelerate = "^1.12.0"
sglang = "0.5.2"
pybase64 = "^1.4.3"
sgl-kernel = "0.3.11"
xgrammar = "^0.1.29"
xformers = "0.0.32.post1"
openai = "^2.14.0"
partial-json-parser = "^0.2.1.1.post7"
sentencepiece = "^0.2.1"
dill = "^0.4.0"
compressed-tensors = "^0.13.0"
einops = "^0.8.1"
ninja = "^1.13.0"
flash-attn = "^2.8.3"
msgspec = "^0.20.0"
torchao = "^0.15.0"
pyannote-audio = "^4.0.3"
paddleocr = "^3.3.2"
paddlepaddle = "^3.2.2"
pyhwp = "^0.1b15"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
black = "^23.12.0"
isort = "^5.13.0"
mypy = "^1.7.0"
flake8 = "^6.1.0"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

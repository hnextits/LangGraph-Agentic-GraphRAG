<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mindmap - NotebookLM Style</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Google Sans', 'Roboto', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #ffffff;
            min-height: 100vh;
            color: #202124;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 24px;
        }
        
        .header {
            padding: 32px 0;
            border-bottom: 1px solid #e8eaed;
            margin-bottom: 32px;
        }
        
        .header h1 {
            font-size: 28px;
            font-weight: 400;
            color: #202124;
            margin-bottom: 8px;
        }
        
        .header p {
            color: #5f6368;
            font-size: 14px;
        }
        
        .mindmap-tree {
            background: #ffffff;
        }
        
        .tree-node {
            margin-bottom: 4px;
        }
        
        .node-header {
            display: flex;
            align-items: center;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
            user-select: none;
        }
        
        .node-header:hover {
            background: #f1f3f4;
        }
        
        .node-toggle {
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 8px;
            color: #5f6368;
            font-size: 12px;
            flex-shrink: 0;
        }
        
        .node-toggle.empty {
            visibility: hidden;
        }
        
        .node-content {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .node-icon {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            flex-shrink: 0;
        }
        
        .node-icon.topic {
            background: #e8f0fe;
            color: #1967d2;
        }
        
        .node-icon.subtopic {
            background: #fef7e0;
            color: #ea8600;
        }
        
        .node-icon.detail {
            background: #e6f4ea;
            color: #137333;
        }
        
        .node-title {
            font-size: 14px;
            color: #202124;
            font-weight: 400;
        }
        
        .node-citation {
            font-size: 11px;
            color: #5f6368;
            font-family: 'Roboto Mono', monospace;
        }
        
        .node-children {
            margin-left: 28px;
            border-left: 1px solid #e8eaed;
            padding-left: 12px;
            display: none;
        }
        
        .node-children.expanded {
            display: block;
        }
        
        .detail-view {
            display: none;
        }
        
        .detail-view.active {
            display: block;
            animation: fadeIn 0.3s;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .detail-header {
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 3px solid #667eea;
        }
        
        .detail-header h2 {
            font-size: 28px;
            color: #333;
            margin-bottom: 10px;
        }
        
        .detail-header .summary {
            color: #666;
            font-size: 16px;
            line-height: 1.6;
        }
        
        .detail-header .citations {
            margin-top: 10px;
            padding: 10px;
            background: #f0f0f0;
            border-radius: 6px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            color: #667eea;
        }
        
        .subtopic-card {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 25px;
            border-left: 4px solid #764ba2;
        }
        
        .subtopic-title {
            font-size: 20px;
            font-weight: 600;
            color: #333;
            margin-bottom: 15px;
        }
        
        .detail-item {
            padding: 15px;
            margin: 10px 0;
            background: white;
            border-radius: 8px;
            border-left: 3px solid #ddd;
            transition: all 0.2s;
        }
        
        .detail-item:hover {
            border-left-color: #667eea;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .detail-item.high {
            border-left-color: #e74c3c;
        }
        
        .detail-item.medium {
            border-left-color: #f39c12;
        }
        
        .detail-item.low {
            border-left-color: #3498db;
        }
        
        .detail-text {
            color: #333;
            line-height: 1.6;
            margin-bottom: 8px;
        }
        
        .detail-meta {
            display: flex;
            gap: 15px;
            font-size: 12px;
            color: #999;
        }
        
        .importance-badge {
            padding: 3px 8px;
            border-radius: 4px;
            font-weight: 600;
            text-transform: uppercase;
        }
        
        .importance-badge.high {
            background: #fee;
            color: #e74c3c;
        }
        
        .importance-badge.medium {
            background: #fef5e7;
            color: #f39c12;
        }
        
        .importance-badge.low {
            background: #ebf5fb;
            color: #3498db;
        }
        
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }
        
        .empty-state svg {
            width: 100px;
            height: 100px;
            margin-bottom: 20px;
            opacity: 0.3;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>마인드맵</h1>
            <p>문서 구조 시각화</p>
        </div>
        
        <div class="mindmap-tree" id="mindmap-tree">
            <!-- Tree will be rendered here -->
        </div>
    </div>
    
    <script>
        const mindmapData = {
  "topics": [
    {
      "name": "SM 엔터테인먼트 아티스트 및 계열사",
      "summary": "SM 엔터테인먼트 소속 아티스트와 계열사 목록",
      "citations": "seg_032, seg_017, seg_009",
      "subtopics": [
        {
          "name": "아티스트 및 계열사",
          "citations": "seg_009, seg_017",
          "details": []
        },
        {
          "name": "소속 및 과거 소속",
          "citations": "seg_016, seg_006",
          "details": []
        }
      ]
    },
    {
      "name": "K-POP 아티스트 및 수상 내역",
      "summary": "2022년과 2023년 K-POP 아티스트들의 음악 활동 및 수상 기록",
      "citations": "seg_024, seg_031, seg_030",
      "subtopics": []
    },
    {
      "name": "K팝 그룹의 글로벌 성공",
      "summary": "K팝 그룹이 국제 차트와 공연에서 성공",
      "citations": "seg_011, seg_005, seg_004",
      "subtopics": []
    },
    {
      "name": "aespa의 음악 활동",
      "summary": "aespa의 음악 활동 및 수상 기록",
      "citations": "seg_025, seg_019, seg_012",
      "subtopics": []
    },
    {
      "name": "가상 세계와 아바타",
      "summary": "에스파의 FLAT 세계관과 æ 아바타",
      "citations": "seg_018, seg_000, seg_010",
      "subtopics": []
    },
    {
      "name": "...",
      "summary": "...",
      "citations": "seg_027, seg_021, seg_002",
      "subtopics": []
    }
  ]
};
        
        function toggleNode(nodeId) {
            const childrenEl = document.getElementById(`children-${nodeId}`);
            const toggleEl = document.getElementById(`toggle-${nodeId}`);
            
            if (childrenEl) {
                const isExpanded = childrenEl.classList.contains('expanded');
                childrenEl.classList.toggle('expanded');
                toggleEl.textContent = isExpanded ? '▶' : '▼';
            }
        }
        
        function renderNode(node, type, parentId = '') {
            const nodeId = `${parentId}-${node.name.replace(/\s+/g, '-')}`;
            const hasChildren = (node.subtopics && node.subtopics.length > 0) || (node.details && node.details.length > 0);
            
            let html = `
                <div class="tree-node">
                    <div class="node-header" onclick="toggleNode('${nodeId}')">
                        <div class="node-toggle ${hasChildren ? '' : 'empty'}" id="toggle-${nodeId}">
                            ${hasChildren ? '▼' : ''}
                        </div>
                        <div class="node-content">
                            <div class="node-icon ${type}">
                                ${type === 'topic' ? '📌' : type === 'subtopic' ? '📄' : '•'}
                            </div>
                            <div class="node-title">${node.name}</div>
                            ${node.citations ? `<div class="node-citation">[${node.citations}]</div>` : ''}
                        </div>
                    </div>
            `;
            
            if (hasChildren) {
                html += `<div class="node-children expanded" id="children-${nodeId}">`;
                
                if (node.subtopics) {
                    node.subtopics.forEach(subtopic => {
                        html += renderNode(subtopic, 'subtopic', nodeId);
                    });
                }
                
                if (node.details) {
                    node.details.forEach(detail => {
                        html += renderNode(detail, 'detail', nodeId);
                    });
                }
                
                html += '</div>';
            }
            
            html += '</div>';
            return html;
        }
        
        function renderTree() {
            const treeContainer = document.getElementById('mindmap-tree');
            let treeHtml = '';
            
            if (mindmapData && mindmapData.topics) {
                mindmapData.topics.forEach(topic => {
                    treeHtml += renderNode(topic, 'topic', 'root');
                });
            }
            
            treeContainer.innerHTML = treeHtml;
        }
        
        // Initialize on page load
        document.addEventListener('DOMContentLoaded', () => {
            renderTree();
        });
    </script>
</body>
</html>
